<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彰化社區大學 - 隨機抽獎系統</title>
    <style>
        /* --- 科技感全域樣式 --- */
        :root {
            --bg-color: #0a0e17;
            --card-bg: rgba(16, 24, 40, 0.85);
            --primary-neon: #00f3ff;
            --secondary-neon: #ff007f;
            --accent-gold: #ffd700;
            --text-color: #e0e6ed;
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 243, 255, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- 頁首標題區 --- */
        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            color: var(--primary-neon);
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: clamp(1rem, 2.8vw, 1.3rem);
            color: var(--secondary-neon);
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            font-weight: 400;
        }

        /* --- 控制面板區 --- */
        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--primary-neon);
            box-shadow: var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 850px;
            backdrop-filter: blur(8px);
            margin-bottom: 25px;
        }

        .inputs-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-item label {
            font-size: 0.95rem;
            color: #b0c4de;
        }

        .input-item input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--primary-neon);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            width: 80px;
            text-align: center;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-item input:focus {
            box-shadow: 0 0 8px var(--primary-neon);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            background: transparent;
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 15px var(--primary-neon);
        }

        button#startBtn {
            border-color: var(--secondary-neon);
            color: var(--secondary-neon);
        }

        button#startBtn:hover:not(:disabled) {
            background: var(--secondary-neon);
            color: #fff;
            box-shadow: 0 0 15px var(--secondary-neon);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
            color: #888;
        }

        /* --- 倒數與結果顯示區 --- */
        .status-display {
            text-align: center;
            margin-bottom: 20px;
            min-height: 80px;
        }

        .timer-box {
            font-size: 1.5rem;
            color: #fff;
        }

        .timer-box span {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary-neon);
            font-family: 'Courier New', monospace;
        }

        .winner-box {
            display: none;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--accent-gold);
            text-shadow: 0 0 20px var(--accent-gold);
            font-weight: bold;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* --- 抽獎表格區（每列最多10格） --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .grid-cell {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #8a9ba8;
            transition: all 0.1s ease;
        }

        /* 高亮狀態 */
        .grid-cell.highlight {
            background: var(--secondary-neon);
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 20px var(--secondary-neon), inset 0 0 10px #fff;
            transform: scale(1.08);
            z-index: 2;
        }

        /* 最終中獎狀態 */
        .grid-cell.winner {
            background: var(--accent-gold);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 30px var(--accent-gold), inset 0 0 15px #fff;
            transform: scale(1.15);
            z-index: 3;
        }

        /* --- 響應式手機微調 --- */
        @media (max-width: 600px) {
            .grid-container {
                gap: 6px;
            }
            .grid-cell {
                font-size: 0.9rem;
                border-radius: 4px;
            }
        }

        /* --- 彩帶特效動畫容器 --- */
        #confetti-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 20px;
            opacity: 0.8;
            animation: fall 3s ease-in-out infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>彰化社區大學-讓AI解決我的生活大小事成果展</h1>
        <h2>隨機抽獎系統-學員：劉美汝設計</h2>
    </header>

    <main style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <!-- 設定與控制區 -->
        <section class="control-panel">
            <div class="inputs-group">
                <div class="input-item">
                    <label for="cellCount">抽獎儲存格數量:</label>
                    <input type="number" id="cellCount" value="20" min="1" max="100">
                </div>
                <div class="input-item">
                    <label for="countdownSec">倒數秒數:</label>
                    <input type="number" id="countdownSec" value="5" min="1" step="0.5">
                </div>
            </div>
            <div class="button-group">
                <button id="configBtn">設定</button>
                <button id="startBtn">開始抽獎</button>
            </div>
        </section>

        <!-- 狀態與結果顯示區 -->
        <section class="status-display">
            <div id="timerBox" class="timer-box">
                倒數計時：<span id="timer">5.0</span> 秒
            </div>
            <div id="winnerBox" class="winner-box"></div>
        </section>

        <!-- 網格抽獎區域 -->
        <section id="gridContainer" class="grid-container"></section>
    </main>

    <!-- 彩帶效果容器 -->
    <div id="confetti-wrapper"></div>

    <script>
        // DOM 元素獲取
        const cellCountInput = document.getElementById('cellCount');
        const countdownSecInput = document.getElementById('countdownSec');
        const configBtn = document.getElementById('configBtn');
        const startBtn = document.getElementById('startBtn');
        const gridContainer = document.getElementById('gridContainer');
        const timerDisplay = document.getElementById('timer');
        const timerBox = document.getElementById('timerBox');
        const winnerBox = document.getElementById('winnerBox');
        const confettiWrapper = document.getElementById('confetti-wrapper');

        let totalCells = 20;
        let countdownTime = 5.0;
        let timerInterval = null;
        let highlightInterval = null;
        let currentHighlightIndex = -1;

        // 初始化產生表格
        function createGrid() {
            gridContainer.innerHTML = '';
            totalCells = parseInt(cellCountInput.value) || 20;
            if (totalCells < 1) totalCells = 1;

            for (let i = 1; i <= totalCells; i++) {
                const cell = document.createElement('div');
                cell.classList.add('grid-cell');
                cell.innerText = i;
                cell.id = `cell-${i}`;
                gridContainer.appendChild(cell);
            }
            
            // 重置介面狀態
            resetDisplay();
        }

        // 重置文字顯示狀態
        function resetDisplay() {
            const sec = parseFloat(countdownSecInput.value) || 5;
            timerDisplay.innerText = sec.toFixed(1);
            timerBox.style.display = 'block';
            winnerBox.style.display = 'none';
            winnerBox.innerText = '';
            confettiWrapper.innerHTML = '';
            clearHighlights();
        }

        // 清除所有高亮狀態
        function clearHighlights() {
            const cells = document.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                cell.classList.remove('highlight', 'winner');
            });
        }

        // 按鈕事件：設定
        configBtn.addEventListener('click', () => {
            createGrid();
        });

        // 按鈕事件：開始抽獎
        startBtn.addEventListener('click', () => {
            let initialSec = parseFloat(countdownSecInput.value);
            if (isNaN(initialSec) || initialSec <= 0) initialSec = 5;
            
            countdownTime = initialSec;
            timerDisplay.innerText = countdownTime.toFixed(1);

            // 鎖定介面按鈕
            configBtn.disabled = true;
            startBtn.disabled = true;
            cellCountInput.disabled = true;
            countdownSecInput.disabled = true;

            resetDisplay();

            // 1. 每 0.1 秒隨機高亮一個儲存格
            highlightInterval = setInterval(() => {
                clearHighlights();
                const randomIndex = Math.floor(Math.random() * totalCells) + 1;
                const targetCell = document.getElementById(`cell-${randomIndex}`);
                if (targetCell) {
                    targetCell.classList.add('highlight');
                    currentHighlightIndex = randomIndex;
                }
            }, 100);

            // 2. 倒數計時器 (每 0.1 秒更新一次時間)
            timerInterval = setInterval(() => {
                countdownTime -= 0.1;

                if (countdownTime <= 0) {
                    // 秒數歸零修正
                    countdownTime = 0;
                    timerDisplay.innerText = "0.0";
                    
                    // 結束抽獎
                    endLottery();
                } else {
                    timerDisplay.innerText = countdownTime.toFixed(1);
                }
            }, 100);
        });

        // 結束抽獎與中獎呈現
        function endLottery() {
            clearInterval(timerInterval);
            clearInterval(highlightInterval);

            clearHighlights();

            // 決定最終中獎號碼
            const finalWinner = currentHighlightIndex > 0 ? currentHighlightIndex : Math.floor(Math.random() * totalCells) + 1;
            const winnerCell = document.getElementById(`cell-${finalWinner}`);
            
            if (winnerCell) {
                winnerCell.classList.add('winner');
            }

            // 隱藏倒數，顯示中獎資訊
            timerBox.style.display = 'none';
            winnerBox.innerText = `🎉 最終中獎號碼：${finalWinner} 號 🎉`;
            winnerBox.style.display = 'block';

            // 發射彩帶動畫
            launchConfetti();

            // 解鎖按鈕
            configBtn.disabled = false;
            startBtn.disabled = false;
            cellCountInput.disabled = false;
            countdownSecInput.disabled = false;
        }

        // 生成彩帶特效
        function launchConfetti() {
            confettiWrapper.innerHTML = '';
            const colors = ['#ff007f', '#00f3ff', '#ffd700', '#00ff88', '#ffffff', '#ff9900'];
            
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                confettiWrapper.appendChild(confetti);
            }
        }

        // 預設載入時生成一次表格
        createGrid();
    </script>
</body>
</html>
