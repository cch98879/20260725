<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI抽獎系統</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    background:linear-gradient(135deg,#051937,#004d7a,#008793,#00bf72,#a8eb12);
    min-height:100vh;
    color:white;
    text-align:center;
    overflow-x:hidden;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    font-size:2rem;
    color:#00ffff;
    text-shadow:0 0 20px cyan;
    margin-bottom:10px;
}

h2{
    font-size:1.2rem;
    color:#fff;
    margin-bottom:25px;
}

.control{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

input{
    width:150px;
    padding:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
    text-align:center;
}

button{
    padding:10px 25px;
    border:none;
    border-radius:10px;
    background:#00d4ff;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px cyan;
}

#countdown{
    font-size:2rem;
    color:#ffff66;
    margin:15px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:10px;
    margin:auto;
}

.cell{
    background:#123;
    border:2px solid #00ffff;
    border-radius:12px;
    aspect-ratio:1/1;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:1.5rem;
    transition:.1s;
    box-shadow:0 0 8px #00ffff55;
}

.active{
    background:#ffeb3b;
    color:#000;
    transform:scale(1.15);
    box-shadow:0 0 25px yellow;
}

#winner{
    margin-top:30px;
    font-size:3rem;
    font-weight:bold;
    color:#ffeb3b;
    text-shadow:0 0 25px gold;
    animation:zoom .8s infinite alternate;
}

@keyframes zoom{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

/* 彩帶 */

.confetti{
    position:fixed;
    width:10px;
    height:20px;
    top:-20px;
    animation:fall linear forwards;
    z-index:999;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

@media(max-width:768px){

.grid{
grid-template-columns:repeat(5,1fr);
}

h1{
font-size:1.4rem;
}

h2{
font-size:1rem;
}

#winner{
font-size:2rem;
}

}

</style>
</head>

<body>

<div class="container">

<h1>彰化社區大學-讓AI解決我的生活大小事成果展</h1>

<h2>隨機抽獎系統-學員：施淑緞設計</h2>

<div class="control">

<label>
抽獎儲存格數量
<br>
<input id="num" type="number" value="20" min="1">
</label>

<label>
倒數秒數
<br>
<input id="sec" type="number" value="5" min="1" step="0.1">
</label>

<button onclick="createGrid()">設定</button>

<button onclick="startLottery()">開始抽獎</button>

</div>

<div id="countdown"></div>

<div class="grid" id="grid"></div>

<div id="winner"></div>

</div>

<script>

let timer;
let current=-1;

function createGrid(){

clearInterval(timer);

document.getElementById("winner").innerHTML="";
document.getElementById("countdown").innerHTML="";

let n=parseInt(document.getElementById("num").value);

let grid=document.getElementById("grid");

grid.innerHTML="";

for(let i=1;i<=n;i++){

let div=document.createElement("div");

div.className="cell";

div.innerHTML=i;

grid.appendChild(div);

}

}

createGrid();

function startLottery(){

clearInterval(timer);

let cells=document.querySelectorAll(".cell");

if(cells.length==0)return;

document.getElementById("winner").innerHTML="";

let total=parseFloat(document.getElementById("sec").value);

let remain=total;

timer=setInterval(()=>{

remain-=0.1;

if(remain<0)remain=0;

document.getElementById("countdown").innerHTML="倒數："+remain.toFixed(1)+" 秒";

if(current>=0)

cells[current].classList.remove("active");

current=Math.floor(Math.random()*cells.length);

cells[current].classList.add("active");

if(remain<=0){

clearInterval(timer);

document.getElementById("winner").innerHTML=
"🎉 最終中獎號碼："+(current+1)+" 🎉";

launchConfetti();

}

},100);

}

function launchConfetti(){

const colors=[
"#ff0",
"#0ff",
"#f0f",
"#0f0",
"#f00",
"#09f",
"#fff"
];

for(let i=0;i<180;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.animationDuration=(2+Math.random()*3)+"s";

c.style.transform="rotate("+Math.random()*360+"deg)";

document.body.appendChild(c);

setTimeout(()=>{

c.remove();

},5000);

}

}

</script>

</body>
</html>
