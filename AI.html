<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>彰化社區大學隨機抽獎系統</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle,#152b55,#020617);
    color:white;
    font-family:"Microsoft JhengHei",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* 科幻外框 */

.container{

    width:90vw;
    height:90vh;

    border:3px solid #00ffff;
    border-radius:25px;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,0.15),
    rgba(0,0,0,0.4)
    );

    box-shadow:
    0 0 30px #00ffff,
    inset 0 0 30px #004466;

    text-align:center;

    padding:20px;

}



/* 標題 */

h1{

    margin:5px;

    color:#00ffff;

    text-shadow:
    0 0 10px cyan,
    0 0 20px cyan;

    font-size:32px;

}


/* 控制區 */

.control{

    margin:15px;

}


input{

    width:100px;

    padding:10px;

    margin:5px;

    font-size:18px;

    border-radius:10px;

    text-align:center;

}


button{

    padding:12px 25px;

    margin:5px;

    font-size:18px;

    border-radius:20px;

    border:none;

    cursor:pointer;

    background:#00ffff;

    color:#002233;

    font-weight:bold;

    box-shadow:0 0 15px cyan;

}


button:hover{

    background:white;

}



/* 表格 */

#grid{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:10px;

}



.row{

    display:flex;

    gap:10px;

}



.cell{

    width:70px;

    height:55px;

    display:flex;

    justify-content:center;

    align-items:center;


    border-radius:15px;

    border:2px solid #00ffff;

    font-size:24px;

    background:#061b36;

    box-shadow:
    0 0 10px #0099ff;

}



.active{

    background:#ffff00;

    color:black;

    transform:scale(1.2);

    box-shadow:
    0 0 30px yellow;

}



/* 倒數 */

#countdown{

    font-size:50px;

    color:#00ff99;

    text-shadow:
    0 0 20px lime;

}



/* 中獎 */

#winner{

    font-size:30px;

    margin-top:10px;

}


.win-animation{

    animation:
    win 0.5s infinite alternate;

}


@keyframes win{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(2);
    }

}



/* 彩帶 */

.confetti{

    position:absolute;

    width:10px;

    height:20px;

    animation:fall 3s linear forwards;

}


@keyframes fall{

    from{
        transform:
        translateY(-100px)
        rotate(0deg);
    }

    to{

        transform:
        translateY(100vh)
        rotate(720deg);

    }

}


</style>

</head>


<body>


<div class="container">


<h1>
彰化社區大學隨機抽獎系統-李信賢設計
</h1>


<div class="control">

抽獎儲存格數量：

<input id="amount" type="number" value="20">


倒數秒數：

<input id="seconds" type="number" value="5">


<br>


<button onclick="createGrid()">
設定
</button>


<button onclick="startLottery()">
開始抽獎
</button>


</div>


<div id="countdown">
準備開始
</div>


<div id="grid"></div>


<div id="winner"></div>


</div>



<script>


let timer;

let current=-1;



// 建立表格

function createGrid(){


let amount=
parseInt(
document.getElementById("amount").value
);


let grid=
document.getElementById("grid");


grid.innerHTML="";


let row;


for(let i=1;i<=amount;i++){


if((i-1)%10==0){

row=document.createElement("div");

row.className="row";

grid.appendChild(row);

}



let cell=
document.createElement("div");


cell.className="cell";


cell.innerHTML=i;


cell.id="cell"+i;


row.appendChild(cell);


}


winner.innerHTML="";

}




// 音效

function playStartSound(){

let ctx=
new AudioContext();


let osc=
ctx.createOscillator();


osc.frequency.value=300;


osc.connect(ctx.destination);


osc.start();


osc.stop(ctx.currentTime+0.3);

}



function playWinSound(){

let ctx=
new AudioContext();


let osc=
ctx.createOscillator();


osc.frequency.value=800;


osc.connect(ctx.destination);


osc.start();


osc.stop(ctx.currentTime+1);


}





// 開始抽獎


function startLottery(){


clearInterval(timer);


let sec=
parseFloat(
document.getElementById("seconds").value
);


if(sec<0) sec=0;


playStartSound();



let endTime=
Date.now()+sec*1000;



timer=setInterval(()=>{


let remain=
(endTime-Date.now())/1000;


if(remain<=0){

clearInterval(timer);

finishLottery();

return;

}



document.getElementById("countdown")
.innerHTML=
remain.toFixed(1)+" 秒";



randomFlash();



},100);



}




// 隨機亮燈


function randomFlash(){


let amount=
document.querySelectorAll(".cell").length;


if(amount==0)return;


if(current>0)

document
.getElementById("cell"+current)
.classList.remove("active");



current=
Math.floor(Math.random()*amount)+1;


document
.getElementById("cell"+current)
.classList.add("active");

}



// 結束

function finishLottery(){


document.getElementById("countdown")
.innerHTML="抽獎完成";


let amount=
document.querySelectorAll(".cell").length;


let winner=
Math.floor(Math.random()*amount)+1;



document.querySelectorAll(".cell")
.forEach(c=>{
c.classList.remove("active");
});



let target=
document.getElementById("cell"+winner);


target.classList.add("active");



document.getElementById("winner")
.innerHTML=
"🎉 最終中獎號碼："+
winner+
"號 🎉";



document.getElementById("winner")
.className=
"win-animation";



playWinSound();


firework();


}




// 彩帶效果

function firework(){


for(let i=0;i<120;i++){


let c=
document.createElement("div");


c.className="confetti";


c.style.left=
Math.random()*100+"vw";


c.style.background=
"hsl("+Math.random()*360+",100%,50%)";


c.style.animationDuration=
(2+Math.random()*2)+"s";


document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},4000);



}


}



createGrid();


</script>


</body>
</html>
