<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI抽獎系統</title>

<style>

*{
box-sizing:border-box;
font-family:"Microsoft JhengHei",sans-serif;
}

body{
margin:0;
background:
radial-gradient(circle at top,#10345c,#050816 70%);
color:white;
overflow-x:hidden;
}

.container{
width:95%;
max-width:1100px;
margin:auto;
padding:20px;
text-align:center;
}

h1{
margin:5px;
font-size:clamp(24px,3vw,40px);
color:#00ffff;
text-shadow:0 0 15px cyan;
}

h2{
margin-top:10px;
font-size:clamp(18px,2vw,28px);
color:#66ffcc;
}

.panel{
margin-top:25px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
align-items:center;
}

input{
width:120px;
padding:10px;
font-size:18px;
text-align:center;
border-radius:10px;
border:none;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
background:#00bfff;
color:white;
font-weight:bold;
transition:.3s;
}

button:hover{
transform:scale(1.05);
background:#00ffff;
color:#000;
}

#countdown{
margin:25px;
font-size:40px;
color:yellow;
font-weight:bold;
text-shadow:0 0 20px orange;
}

table{
margin:auto;
border-collapse:separate;
border-spacing:10px;
}

td{
width:65px;
height:65px;
border-radius:12px;
background:#102c52;
border:2px solid #00d4ff;
font-size:22px;
font-weight:bold;
transition:.1s;
}

.active{
background:#ffeb3b;
color:#000;
transform:scale(1.15);
box-shadow:0 0 20px yellow;
}

#winner{
margin-top:30px;
font-size:55px;
font-weight:bold;
color:#ffea00;
text-shadow:
0 0 20px orange,
0 0 40px red;
display:none;
animation:zoom 1s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/******** 彩帶 ********/

.confetti{
position:fixed;
top:-20px;
width:10px;
height:20px;
opacity:.9;
animation:fall linear forwards;
}

@keyframes fall{

0%{
transform:translateY(-20px) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(720deg);
}

}

@media(max-width:600px){

td{
width:48px;
height:48px;
font-size:18px;
}

button{
font-size:16px;
padding:10px 18px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>彰化社區大學-讓AI解決我的生活大小事成果展</h1>

<h2>隨機抽獎系統-學員：劉盈瑩設計</h2>

<div class="panel">

<label>抽獎儲存格數量</label>

<input id="cells" type="number" value="20" min="1">

<label>倒數秒數</label>

<input id="seconds" type="number" value="5" step="0.1">

<button onclick="createTable()">設定</button>

<button onclick="startLottery()">開始抽獎</button>

</div>

<div id="countdown"></div>

<div id="tableArea"></div>

<div id="winner"></div>

</div>

<script>

let timer;
let current=-1;

createTable();

function createTable(){

clearInterval(timer);

document.getElementById("winner").style.display="none";

let total=parseInt(document.getElementById("cells").value);

let html="<table>";

for(let i=0;i<total;i++){

if(i%10==0) html+="<tr>";

html+="<td id='c"+i+"'>"+(i+1)+"</td>";

if(i%10==9 || i==total-1) html+="</tr>";

}

html+="</table>";

document.getElementById("tableArea").innerHTML=html;

document.getElementById("countdown").innerHTML="";

}

function startLottery(){

clearInterval(timer);

let total=parseInt(document.getElementById("cells").value);

let sec=parseFloat(document.getElementById("seconds").value);

let remain=sec;

let winner=0;

document.getElementById("winner").style.display="none";

timer=setInterval(()=>{

remain-=0.1;

if(remain<0) remain=0;

document.getElementById("countdown").innerHTML=
"倒數："+remain.toFixed(1)+" 秒";

if(current!=-1)
document.getElementById("c"+current).classList.remove("active");

winner=Math.floor(Math.random()*total);

current=winner;

document.getElementById("c"+winner).classList.add("active");

if(remain<=0){

clearInterval(timer);

document.getElementById("winner").style.display="block";

document.getElementById("winner").innerHTML=
"🎉 最終中獎號碼："+(winner+1);

confetti();

}

},100);

}

function confetti(){

for(let i=0;i<180;i++){

let d=document.createElement("div");

d.className="confetti";

d.style.left=Math.random()*100+"vw";

d.style.background=
`hsl(${Math.random()*360},100%,50%)`;

d.style.animationDuration=
(2+Math.random()*3)+"s";

d.style.transform=
"rotate("+Math.random()*360+"deg)";

document.body.appendChild(d);

setTimeout(()=>d.remove(),5000);

}

}

</script>

</body>
</html>
