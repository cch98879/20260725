<meta charset="utf-8">
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI隨機抽獎系統</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft JhengHei",sans-serif;
}

body{

background:
radial-gradient(circle at top,#16345c,#071320 60%,#02070d);

color:white;

min-height:100vh;

display:flex;
justify-content:center;
align-items:flex-start;

padding:20px;
}

.container{

width:min(1200px,100%);
text-align:center;

}

h1{

font-size:clamp(26px,4vw,42px);
color:#4fdcff;
text-shadow:0 0 20px #00ffff;
margin-bottom:10px;

}

h2{

font-size:clamp(18px,2vw,28px);
color:#ffd54f;
margin-bottom:25px;

}

.panel{

display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
margin-bottom:20px;

}

.panel label{
font-size:18px;
}

.panel input{

width:90px;
padding:8px;
font-size:18px;
text-align:center;
border:none;
border-radius:8px;

}

button{

padding:10px 24px;
font-size:18px;
font-weight:bold;
border:none;
cursor:pointer;
border-radius:8px;

background:#00bcd4;
color:white;

transition:.3s;

}

button:hover{

transform:scale(1.08);

box-shadow:0 0 20px cyan;

}

#countdown{

font-size:42px;
font-weight:bold;

margin:15px;

color:#ffeb3b;

text-shadow:0 0 20px yellow;

}

.grid{

display:grid;

grid-template-columns:repeat(10,1fr);

gap:12px;

margin-top:20px;

}

.cell{

background:#0d2748;

border:2px solid #0ff;

height:70px;

display:flex;

justify-content:center;

align-items:center;

font-size:28px;

font-weight:bold;

border-radius:12px;

transition:.15s;

}

.active{

background:#00e5ff;

color:#000;

transform:scale(1.08);

box-shadow:

0 0 25px cyan,

0 0 45px cyan;

}

#winner{

margin-top:30px;

font-size:60px;

font-weight:bold;

color:#ffeb3b;

text-shadow:

0 0 20px yellow,

0 0 40px orange;

display:none;

animation:zoom .6s infinite alternate;

}

@keyframes zoom{

from{transform:scale(1);}
to{transform:scale(1.12);}

}

/******** 彩帶 ********/

.confetti{

position:fixed;

width:10px;

height:18px;

top:-20px;

animation:fall linear forwards;

opacity:.9;

}

@keyframes fall{

to{

transform:

translateY(110vh)

rotate(720deg);

}

}

@media(max-width:768px){

.grid{

grid-template-columns:repeat(5,1fr);

}

.cell{

height:60px;

font-size:22px;

}

#winner{

font-size:42px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>彰化社區大學－讓AI解決我的生活大小事成果展</h1>

<h2>隨機抽獎系統－學員：鄭健彰設計</h2>

<div class="panel">

<label>抽獎儲存格數量
<input id="num" type="number" value="20" min="1">
</label>

<label>倒數秒數
<input id="sec" type="number" value="5" step="0.1">
</label>

<button onclick="createGrid()">設定</button>

<button onclick="startLottery()">開始抽獎</button>

</div>

<div id="countdown"></div>

<div class="grid" id="grid"></div>

<div id="winner"></div>

</div>

<script>

let total=20;

let timer;

let highlight;

function createGrid(){

total=parseInt(document.getElementById("num").value);

const grid=document.getElementById("grid");

grid.innerHTML="";

document.getElementById("winner").style.display="none";

for(let i=1;i<=total;i++){

let div=document.createElement("div");

div.className="cell";

div.innerText=i;

grid.appendChild(div);

}

}

createGrid();

function startLottery(){

clearInterval(timer);

clearInterval(highlight);

document.getElementById("winner").style.display="none";

const cells=document.querySelectorAll(".cell");

let remain=parseFloat(document.getElementById("sec").value);

let current=0;

document.getElementById("countdown").innerHTML=

"倒數："+remain.toFixed(1)+" 秒";

highlight=setInterval(()=>{

cells.forEach(c=>c.classList.remove("active"));

current=Math.floor(Math.random()*cells.length);

cells[current].classList.add("active");

},100);

timer=setInterval(()=>{

remain-=0.1;

if(remain<0)remain=0;

document.getElementById("countdown").innerHTML=

"倒數："+remain.toFixed(1)+" 秒";

if(remain<=0){

clearInterval(timer);

clearInterval(highlight);

document.getElementById("winner").style.display="block";

document.getElementById("winner").innerHTML=

"🎉 最終中獎號碼："+(current+1);

launchConfetti();

}

},100);

}

function launchConfetti(){

for(let i=0;i<220;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=

`hsl(${Math.random()*360},100%,60%)`;

c.style.animationDuration=

(2+Math.random()*3)+"s";

c.style.transform=

`rotate(${Math.random()*360}deg)`;

document.body.appendChild(c);

setTimeout(()=>{

c.remove();

},5000);

}

}

</script>

</body>
</html>
